<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Padhora</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #2E6DA4; --violet-deep: #1B4A73; --coral: #F2994A; --mint: #4C9A6A;
    --sand: #FFF8ED; --ink: #2B3A4A; --slate: #64748B; --line: rgba(46,109,164,0.12); --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background-color: var(--sand);
    background-image:
      linear-gradient(rgba(46,109,164,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,109,164,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: 'Nunito', sans-serif; color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    position: relative; overflow-x: hidden;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.3; pointer-events: none; }
  .blob1 { width: 300px; height: 300px; background: var(--coral); top: -60px; right: -60px; }
  .blob2 { width: 260px; height: 260px; background: var(--mint); bottom: -60px; left: -60px; opacity: 0.22; }

  .float-doodle { position: absolute; z-index: 2; }
  .float-pencil { top: 8%; left: 6%; animation: floatDoodle1 6s ease-in-out infinite; }
  .float-star { bottom: 10%; right: 8%; animation: floatDoodle2 5s ease-in-out infinite; }
  @keyframes floatDoodle1 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(8deg); } }
  @keyframes floatDoodle2 { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-12deg); } }
  @media (max-width: 640px) { .float-doodle { display: none; } }

  .wrap { max-width: 400px; width: 100%; position: relative; z-index: 3; animation: wrapIn 0.5s cubic-bezier(.2,.9,.25,1.05); }
  @keyframes wrapIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }

  .logo { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; text-align: center; margin-bottom: 4px; }
  .logo .dot { color: var(--coral); }
  .sub {
    text-align: center; font-family: 'Fredoka', sans-serif; font-style: italic; font-weight: 500;
    color: var(--coral); font-size: 15px; margin-bottom: 26px;
  }
  .card {
    background: var(--card); border-radius: 22px; padding: 32px;
    box-shadow: 0 24px 50px rgba(37,26,82,0.16); border: 1px solid rgba(255,255,255,0.6);
  }
  .card h1 {
    font-family: 'Fredoka', sans-serif; font-size: 23px; margin-bottom: 6px;
    background: linear-gradient(100deg, var(--violet), var(--coral) 60%, var(--violet));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .card .desc { font-size: 13px; color: var(--slate); margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--violet); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    font-size: 14px; font-family: 'Nunito', sans-serif; background: #F9FAFB; transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(46,109,164,0.12); }
  .submit-btn {
    width: 100%; background: var(--coral); color: white; border: none; padding: 14px; border-radius: 12px;
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
  }
  .submit-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 22px rgba(242,153,74,0.4); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  .error { color: var(--coral); font-size: 13px; margin-top: 10px; display: none; }
  .switch { text-align: center; font-size: 13px; color: var(--slate); margin-top: 18px; }
  .switch a { color: var(--violet); font-weight: 700; text-decoration: none; }
  .switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <svg class="float-doodle float-pencil" viewBox="0 0 64 64" width="46" height="46">
    <defs><linearGradient id="pencilGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F7B978"/><stop offset="100%" stop-color="#F2994A"/></linearGradient></defs>
    <g transform="rotate(45 32 32)">
      <rect x="26" y="8" width="12" height="38" rx="3" fill="url(#pencilGrad)" filter="drop-shadow(0 4px 6px rgba(242,153,74,0.35))"/>
      <polygon points="26,46 38,46 32,58" fill="#4C3A2E"/>
      <polygon points="29,46 35,46 32,52" fill="#F2C79A"/>
      <rect x="26" y="8" width="12" height="8" rx="3" fill="#EC8AA5"/>
    </g>
  </svg>
  <svg class="float-doodle float-star" viewBox="0 0 64 64" width="34" height="34">
    <defs><linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F9D877"/><stop offset="100%" stop-color="#F2C94C"/></linearGradient></defs>
    <path d="M32 4 L39 24 L60 24 L43 37 L49 58 L32 45 L15 58 L21 37 L4 24 L25 24 Z" fill="url(#starGrad)" filter="drop-shadow(0 4px 6px rgba(242,201,76,0.4))"/>
  </svg>

<div class="wrap">
  <div class="logo">Padhora<span class="dot">.</span></div>
  <div class="sub">Padho Aur Badho.</div>
  <div class="card">
    <h1>Create your tutor account</h1>
    <div class="desc">Sign up, then fill in your profile — parents will see it once it's reviewed.</div>
    <form id="signup-form">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div id="error" class="error"></div>
      <button type="submit" class="submit-btn" id="submit-btn">Sign up</button>
    </form>
    <div class="switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>
<script>
const API_BASE_URL = "https://padhora-backend-production.up.railway.app";
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submit-btn');
  errorEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Creating account...';
  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    localStorage.setItem('padhora_token', data.token);
    localStorage.setItem('padhora_tutor_id', data.tutorId);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign up';
  }
});
</script>
</body>
</html>
