<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padhora Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #3D2B7D; --coral: #FF5F4E; --mint: #4FCB8B;
    --sand: #FBF7EE; --ink: #1A1730; --slate: #6B6584; --line: rgba(61,43,125,0.12); --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); font-family: 'Inter', sans-serif; color: var(--ink); padding: 32px 20px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; margin-bottom: 6px; }
  .sub { color: var(--slate); font-size: 14px; margin-bottom: 24px; }

  .gate { background: var(--card); border-radius: 16px; padding: 28px; max-width: 380px; margin: 60px auto; box-shadow: 0 10px 30px rgba(37,26,82,0.1); }
  .gate label { font-size: 13px; font-weight: 700; color: var(--violet); display: block; margin-bottom: 8px; }
  .gate input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 14px; margin-bottom: 14px; }
  .gate button { width: 100%; background: var(--violet); color: white; border: none; padding: 13px; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .gate .err { color: var(--coral); font-size: 13px; margin-top: 10px; display: none; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab-btn {
    background: var(--card); border: 1.5px solid var(--line); padding: 10px 18px; border-radius: 999px;
    font-weight: 700; font-size: 13px; cursor: pointer; color: var(--slate);
  }
  .tab-btn.active { background: var(--violet); color: white; border-color: var(--violet); }
  .refresh { background: none; border: 1.5px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--violet); margin-bottom: 20px; margin-left: 8px; }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
  .card h3 { font-family: 'Fraunces', serif; font-size: 19px; }
  .status-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; }
  .status-badge.PENDING { background: #FFF3D6; color: #92700C; }
  .status-badge.APPROVED { background: rgba(79,203,139,0.16); color: #2C8A5F; }
  .status-badge.REJECTED { background: #FFE1DC; color: var(--coral); }
  .price { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--violet); font-size: 14px; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 13px; color: var(--ink); margin: 12px 0; }
  .meta-grid .label { color: var(--slate); font-weight: 600; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tag { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(79,203,139,0.14); color: #2C8A5F; }
  .tag.mode-tag { background: rgba(61,43,125,0.1); color: var(--violet); }
  .bio { font-size: 13px; color: var(--ink); margin: 10px 0; line-height: 1.5; background: #F9F8FF; padding: 10px 12px; border-radius: 10px; }
  .address-box { font-size: 12px; color: var(--slate); margin: 10px 0; border-left: 3px solid var(--coral); padding-left: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }
  .approve { background: var(--mint); color: white; }
  .reject { background: #F4E6E4; color: var(--coral); }
  .remove { background: var(--coral); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { text-align: center; color: var(--slate); padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<div id="gate-screen" class="gate">
  <label>Admin key</label>
  <input type="password" id="admin-key-input" placeholder="Enter admin key">
  <button onclick="unlock()">Unlock</button>
  <div class="err" id="gate-err">Incorrect key or couldn't reach the server.</div>
</div>

<div class="wrap" id="admin-screen" style="display:none;">
  <h1>Padhora Admin</h1>
  <div class="sub">Review submissions and manage live listings.</div>
  <div class="tabs">
    <button class="tab-btn active" id="tab-pending" onclick="switchTab('pending')">Pending</button>
    <button class="tab-btn" id="tab-live" onclick="switchTab('live')">Live listings</button>
    <button class="refresh" onclick="loadCurrentTab()">↻ Refresh</button>
  </div>
  <div id="list"></div>
</div>

<script>
const API_BASE_URL = "https://padhora-backend-production.up.railway.app";
let adminKey = "";
let currentTab = "pending";

function unlock() {
  adminKey = document.getElementById('admin-key-input').value;
  loadCurrentTab(true);
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
  document.getElementById('tab-live').classList.toggle('active', tab === 'live');
  loadCurrentTab();
}

async function loadCurrentTab(isFirstLoad = false) {
  const errEl = document.getElementById('gate-err');
  errEl.style.display = 'none';
  const endpoint = currentTab === 'pending' ? '/api/tutors/admin/pending' : '/api/tutors/admin/all';
  try {
    const res = await fetch(`${API_BASE_URL}${endpoint}`, { headers: { 'X-Admin-Key': adminKey } });
    if (res.status === 401) {
      if (isFirstLoad) errEl.style.display = 'block';
      return;
    }
    if (!res.ok) throw new Error('Failed to load');
    let listings = await res.json();
    if (currentTab === 'live') listings = listings.filter(t => t.status === 'APPROVED');

    document.getElementById('gate-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    render(listings);
  } catch (err) {
    errEl.textContent = "Couldn't reach the server. Try again.";
    errEl.style.display = 'block';
  }
}

function gradeSubjectsDisplay(gs) {
  if (!gs || !gs.length) return '—';
  return gs.map(g => g.subjects ? `${g.grade} (${g.subjects})` : g.grade).join('; ');
}

function render(listings) {
  const listEl = document.getElementById('list');
  if (listings.length === 0) {
    listEl.innerHTML = `<div class="empty">Nothing here right now.</div>`;
    return;
  }
  listEl.innerHTML = listings.map(t => `
    <div class="card" id="card-${t.id}">
      <div class="card-top">
        <h3>${t.name} <span class="status-badge ${t.status}">${t.status}</span></h3>
        <div class="price">${t.price ? '₹' + t.price + (t.priceUnit || '') : (t.priceType || '')}</div>
      </div>
      <div class="meta-grid">
        <div><span class="label">Phone:</span> ${t.phone || '—'}</div>
        <div><span class="label">Area:</span> ${t.area || '—'}${t.locality ? ' · ' + t.locality : ''}</div>
        <div><span class="label">Qualification:</span> ${t.qualification || '—'}</div>
        <div><span class="label">Experience:</span> ${t.yearsExperience != null ? t.yearsExperience + ' yrs' : '—'}</div>
        <div><span class="label">Languages:</span> ${(t.languages && t.languages.length) ? t.languages.join(', ') : '—'}</div>
        <div><span class="label">Batch type:</span> ${t.batchType || '—'}</div>
        <div><span class="label">Trial class:</span> ${t.trialAvailable === true ? 'Yes' : t.trialAvailable === false ? 'No' : '—'}</div>
        <div><span class="label">Timings:</span> ${(t.preferredTimings && t.preferredTimings.length) ? t.preferredTimings.join(', ') : '—'}</div>
      </div>
      <div><span class="label" style="font-size:13px;color:var(--slate);">Classes/subjects:</span> <span style="font-size:13px;">${gradeSubjectsDisplay(t.gradeSubjects)}</span></div>
      <div class="tag-row">
        ${(t.modes || []).map(m => `<span class="tag mode-tag">${m}</span>`).join('')}
        ${(t.types || []).map(ty => `<span class="tag">${ty}</span>`).join('')}
      </div>
      ${t.bio ? `<div class="bio">${t.bio}</div>` : ''}
      ${t.fullAddress ? `<div class="address-box">Full address (verification only): ${t.fullAddress}</div>` : ''}
      <div class="actions">
        ${t.status === 'PENDING' ? `
          <button class="btn approve" onclick="act(${t.id}, 'approve')">Approve</button>
          <button class="btn reject" onclick="act(${t.id}, 'reject')">Reject</button>
        ` : `
          <button class="btn remove" onclick="removeTutor(${t.id})">Remove listing</button>
        `}
      </div>
    </div>
  `).join('');
}

async function act(id, action) {
  const card = document.getElementById(`card-${id}`);
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API_BASE_URL}/api/tutors/admin/${id}/${action}`, {
      method: 'PATCH',
      headers: { 'X-Admin-Key': adminKey }
    });
    if (!res.ok) throw new Error('Action failed');
    card.style.opacity = '0.4';
    setTimeout(() => card.remove(), 300);
  } catch (err) {
    buttons.forEach(b => b.disabled = false);
    alert('Something went wrong. Try again.');
  }
}

async function removeTutor(id) {
  if (!confirm('Permanently remove this listing? This cannot be undone.')) return;
  const card = document.getElementById(`card-${id}`);
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  try {
    const res = await fetch(`${API_BASE_URL}/api/tutors/admin/${id}`, {
      method: 'DELETE',
      headers: { 'X-Admin-Key': adminKey }
    });
    if (!res.ok) throw new Error('Delete failed');
    card.style.opacity = '0.4';
    setTimeout(() => card.remove(), 300);
  } catch (err) {
    buttons.forEach(b => b.disabled = false);
    alert('Something went wrong. Try again.');
  }
}
</script>

</body>
</html>
