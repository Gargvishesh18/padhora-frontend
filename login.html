<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Padhora</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #2E6DA4; --violet-deep: #1B4A73; --coral: #F2994A; --mint: #4C9A6A;
    --sand: #FFF8ED; --ink: #2B3A4A; --slate: #64748B; --line: rgba(46,109,164,0.12); --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--sand); font-family: 'Nunito', sans-serif; color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .wrap { max-width: 400px; width: 100%; }
  .logo { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; text-align: center; margin-bottom: 6px; }
  .logo .dot { color: var(--coral); }
  .sub { text-align: center; color: var(--slate); font-size: 14px; margin-bottom: 28px; }
  .card { background: var(--card); border-radius: 20px; padding: 30px; box-shadow: 0 20px 50px rgba(37,26,82,0.12); }
  .card h1 { font-family: 'Fredoka', sans-serif; font-size: 22px; margin-bottom: 6px; }
  .card .desc { font-size: 13px; color: var(--slate); margin-bottom: 22px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--violet); margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); font-size: 14px; font-family: 'Nunito', sans-serif; }
  .field input:focus { outline: 2px solid var(--violet); }
  .submit-btn {
    width: 100%; background: var(--violet); color: white; border: none; padding: 13px; border-radius: 10px;
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px; transition: transform 0.15s ease;
  }
  .submit-btn:hover { transform: scale(1.02); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: var(--coral); font-size: 13px; margin-top: 10px; display: none; }
  .switch { text-align: center; font-size: 13px; color: var(--slate); margin-top: 18px; }
  .switch a { color: var(--violet); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Padhora<span class="dot">.</span></div>
  <div class="sub">Padho Aur Badho.</div>
  <div class="card">
    <h1>Log in to manage your listing</h1>
    <div class="desc">Edit your profile, price, and photos anytime.</div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div>
      <div id="error" class="error"></div>
      <button type="submit" class="submit-btn" id="submit-btn">Log in</button>
    </form>
    <div class="switch">New tutor? <a href="signup.html">Sign up</a></div>
  </div>
</div>
<script>
const API_BASE_URL = "https://padhora-backend-production.up.railway.app";
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submit-btn');
  errorEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    localStorage.setItem('padhora_token', data.token);
    localStorage.setItem('padhora_tutor_id', data.tutorId);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
